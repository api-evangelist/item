aid: item
name: Item
description: Item is an AI-native customer relationship management (CRM) platform, part of
  Y Combinator's Fall 2025 batch. It replaces the traditional CRM with an AI Assistant that
  handles daily work in plain language and customizable Agents that autonomously execute
  business processes across sales, support, and account management. Item connects to 100+
  customer tools, gathers and enriches context automatically, discovers leads that match an
  ideal customer profile, and becomes a company's single source of truth for people,
  companies, and deals.
